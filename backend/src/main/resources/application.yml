spring:
  application:
    name: demo-application
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app_demo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Migrations live in db/migrations at the repo root, not in the backend.
    locations: ${FLYWAY_LOCATIONS:filesystem:../db/migrations}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
